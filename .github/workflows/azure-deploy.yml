name: Build and deploy Snake-App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Verify Prisma Client is generated
        working-directory: backend
        run: |
          test -d node_modules/.prisma/client && echo "OK: .prisma/client exists"
          ls node_modules/.prisma/client/schema.prisma >/dev/null && echo "OK: generated schema.prisma exists"
          if grep -q "@prisma/client/default" dist/config/database.js; then
            echo "FAIL: dist/config/database.js references @prisma/client/default" >&2
            exit 1
          fi
          echo "OK: dist/config/database.js has no stale @prisma/client/default import"

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: snake-backend
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: snake-backend
          path: backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: snake-app-new-2026-2
          package: backend
          app-settings: '-SCM_DO_BUILD_DURING_DEPLOYMENT 0'
